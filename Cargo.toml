[package]
name = "pipewire-control"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.14", features = ["canvas", "tokio"] }
iced_fonts = { version = "0.3", features = ["lucide"] }
pipewire = { version = "0.10", features = ["v0_3_41"] }
tokio = { version = "1", features = ["rt", "sync"] }
